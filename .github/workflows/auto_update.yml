name: Update Giờ Vàng M3U Playlist

on:
  schedule:
    # Chạy tự động 30 phút/lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy tay bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        run: python generate_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add giovang.m3u
          git diff-index --quiet HEAD || git commit -m "Auto update Giờ Vàng playlist [skip ci]"
          git push

