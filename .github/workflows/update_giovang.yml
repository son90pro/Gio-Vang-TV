name: Tự động cập nhật Giờ Vàng M3U

on:
  schedule:
    - cron: '*/30 * * * *' # Chạy tự động mỗi 30 phút
  workflow_dispatch: # Cho phép bấm chạy thủ công

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy Script Scraper Giờ Vàng
        run: python giovang_scraper.py

      - name: Commit và Push file M3U
        run: |
          if [ -f giovang.m3u ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add giovang.m3u
            git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update list m3u Giờ Vàng TV"
            git push
          else
            echo "Lỗi: File giovang.m3u không được tạo ra từ giovang_scraper.py!"
            exit 1
          fi

