name: Auto Update M3U Playlist

on:
  schedule:
    # Chạy tự động 15 phút một lần
    - cron: '*/15 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công trên giao diện GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script update M3U
        run: python generate_m3u.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff-index --quiet HEAD || (git commit -m "Auto-update playlist.m3u [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)
          
