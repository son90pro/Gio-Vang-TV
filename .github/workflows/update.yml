name: Auto Update Giờ Vàng TV M3U

on:
  schedule:
    # Tự động chạy 15 phút một lần
    - cron: '*/15 * * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: python generate_m3u.py

    - name: Commit and Push M3U file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add giovang.m3u
        git status
        git diff-index --quiet HEAD || git commit -m "Auto Update Playlist M3U [skip ci]"
        git push

