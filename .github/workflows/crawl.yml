name: Auto Crawl Badong M3U

on:
  schedule:
    - cron: '0 */3 * * *' # Chạy tự động mỗi 3 tiếng
  workflow_dispatch: # Cho phép bấm chạy thủ công trên web GitHub

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Crawler Script
        run: python badong_crawler.py

      - name: Commit and push playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto-update M3U playlist [skip ci]" && git push)
          
